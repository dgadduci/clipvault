[package]
name = "clipvault-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Platform adapters and trait boundaries for ClipVault"

[features]
default = []
# Real clipboard backed by `arboard` (cross-platform).
clipboard-arboard = ["dep:arboard"]
# Real hotkey manager backed by `global-hotkey` (cross-platform).
hotkey-global = ["dep:global-hotkey"]
# macOS native APIs (NSWorkspace, CGEvent) via `objc2`.
macos-native = [
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:dispatch2",
    "dep:block2",
]
# Linux X11 active app, synthetic paste and the raw-input hotkey fallback via
# `x11rb`. The XInput2 extension lets the hotkey adapter recover when a
# passive key event is not delivered during an active keyboard grab; it does
# not affect Wayland or non-Linux builds.
linux-x11 = ["dep:x11rb"]
# Process-wide Xlib thread-safety preflight (`XInitThreads`).
# Compiled only when the host can create the Xlib backend of
# `global-hotkey` so macOS, Windows and Linux builds that opt out of
# the `hotkey-global` feature do not link `x11-dl`. The crate ships
# the same dynamic loader `global-hotkey` already pulls in
# transitively on Linux builds, so adding it here does not bring a
# new third-party dependency into the graph.
linux-xlib-init = ["dep:x11-dl"]
# Linux native Wayland active-app probe. Uses only `std::os::unix`
# primitives plus the bundled protocol parser so the build does not
# need `wayland-scanner`, `libwayland-bin` or any external tool at
# runtime. The probe targets two public protocols:
#
# 1. `ext-foreign-toplevel-list-v1` (preferred).
# 2. `zwlr_foreign_toplevel_management_unstable_v1` (fallback for
#    wlroots-based compositors when the first protocol is missing).
#
# Both protocols are spoken by the same hand-written marshal/unmarshal
# logic; the choice between them is driven by the registry the
# compositor publishes and the only on-disk artefact the build
# needs is the protocol XML, which is bundled with the source tree.
linux-wayland-active-app = []
# Optional GNOME Shell integration on Linux Wayland. Bundles the
# `GnomeShellActiveApplication` probe (the per-session Unix socket
# listener), the bundled-extension installer and the extension
# service that combines consent + install + listener lifecycle.
# Enabling the feature activates the integration in the shell
# bootstrap but the user must explicitly accept the consent
# prompt before anything is written to disk.
linux-gnome-shell-integration = []
# Pure-Rust SVG → PNG rasterizer used by the Linux metadata provider
# to honour `Icon=<name>` entries that ship as SVG instead of PNG.
# `default-features = false` keeps the parser/raster stack free of
# font handling, system font enumeration and external image
# decoders — every one of those would let a malicious `.desktop`
# file pull arbitrary bytes from the host filesystem or the
# network during a metadata lookup. The provider already pins the
# maximum output dimensions and rejects over-sized SVGs.
linux-svg-raster = ["dep:resvg"]
# Concrete secure credential store for the
# `local-peer-identity-foundation` change. Pulls in `keyring` with
# the Apple Keychain (macOS) and Secret Service over D-Bus
# (Linux) backends. The core never enables this feature — it only
# declares the `PeerIdentityStore` trait. Production shells that
# want the real store enable the feature; tests rely on the fake
# store the core ships.
local-peer-identity-keychain = ["dep:keyring"]
# Production mDNS adapter for the `local-peer-discovery` change.
# Pulls in `mdns-sd` (only behind this feature) so the platform
# crate still compiles without the multicast backend — tests,
# cross-compiles to unsupported targets and `cargo check` runs on
# every host link the noop stub instead. The shell enables this
# feature on macOS / Linux; the noop remains the fallback for
# Windows builds and for any host the bootstrap cannot install a
# real adapter on. The core / db / frontend never depend on this
# feature; only `clipvault-app` (the Tauri shell) does.
local-peer-discovery-mdns = ["dep:mdns-sd"]
# Production TLS / mTLS transport for the `local-peer-mutual-pairing`
# change. Pulls in `tokio` + `rustls` + `tokio-rustls` + `rcgen`
# behind the same `local-peer-pairing-tls` feature so the platform
# crate keeps compiling without the TLS stack — cross-compiles
# to unsupported targets, the distroless test sandbox, and
# `cargo check` runs on hosts that cannot link the mDNS / TLS
# backends all link the noop transport instead. The shell enables
# this feature on macOS / Linux; the noop remains the fallback for
# Windows builds and for any host the bootstrap cannot install a
# real adapter on.
local-peer-pairing-tls = [
    "dep:tokio",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rcgen",
    "dep:rustls-pki-types",
    "dep:rustls-webpki",
]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
# `time` types for the metadata-only `TxtRecord` the discovery
# adapter pushes into the runtime. Already pulled in by
# `clipvault-core` (and by extension by `clipvault-db`); surfacing
# it here keeps the platform adapter contract self-contained
# without forcing the runtime to expose its own time types.
time = { workspace = true }
# Pure-Rust PNG decoder used by the macOS `public.png` capture
# bridge to validate the bytes the pasteboard exposes. The crate is
# already in the workspace graph through `clipvault-core`'s asset
# store; surfacing it here adds no new third-party code to the build
# and lets the platform layer own the PNG fidelity contract without
# pulling in `clipvault-core`.
png = { workspace = true }
# SHA-256 used by the `local-peer-identity-keychain` feature to
# derive `peer_id` and `fingerprint` from the public key. Already
# in the workspace graph; surfaced here so the platform owns the
# hashing contract.
sha2 = { workspace = true }
# Ed25519 + randomness used by the
# `local-peer-identity-keychain` feature to derive the
# `LocalPeerIdentity` from the 32-byte seed the secure store
# returns. Pulled in transitively by the core crate; the direct
# dependency keeps the platform build hermetic.
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }

arboard = { workspace = true, optional = true }
global-hotkey = { workspace = true, optional = true }
x11rb = { workspace = true, optional = true, features = ["allow-unsafe-code", "xinput", "xtest"] }
# Dynamic Xlib loader used by the `linux-xlib-init` preflight to call
# `XInitThreads` once before `global-hotkey` opens its Xlib thread.
# The crate is the same one `global-hotkey` already pulls in
# transitively on Linux builds; declaring it directly keeps the
# platform crate's Xlib surface stable instead of relying on the
# accidental transitive import.
x11-dl = { workspace = true, optional = true }
# JSON serialisation for the GNOME integration wire envelopes and
# the consent/installation surfaces. Already in the workspace graph
# through `clipvault-core`; surfaced here so the platform layer can
# own the wire contract without `clipvault-core` having to depend on
# runtime-only Linux code.
serde_json = { workspace = true }
# `resvg` ships `usvg` (SVG parser), `tiny-skia` (rasterizer) and a
# thin renderer under a single crate. With `default-features = false`
# we get the no-text / no-fonts / no-raster-images path, which is the
# minimum needed to honour the SVG icons `.desktop` files ship while
# never executing scripts, fetching network resources or loading
# arbitrary font files from the host.
resvg = { version = "0.45", default-features = false, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-core-graphics = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
# Already pulled in transitively by `objc2-core-foundation`; surfaced
# here so the macOS main-queue refresher can build its dispatch timer
# without forcing every platform build to compile it.
dispatch2 = { version = "0.3", optional = true, features = ["std", "alloc", "block2", "objc2"] }
block2 = { version = "0.6", optional = true }
# Cross-platform credential storage. Only linked when the
# `local-peer-identity-keychain` feature is active. The core
# never references this crate directly — it consumes the trait
# the platform crate re-exports.
keyring = { workspace = true, optional = true }
# Cross-platform DNS-SD/mDNS daemon. Only linked when the
# `local-peer-discovery-mdns` feature is active on macOS / Linux
# production builds. The platform layer owns the multicast
# surface so the core never references the crate directly.
mdns-sd = { workspace = true, optional = true }
# Tokio async runtime + TLS stack the `local-peer-mutual-pairing`
# change drives from inside the platform crate. The platform layer
# owns the listener / connector / pairing session surface so the
# core never references `tokio`, `rustls` or `rcgen` directly.
tokio = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
# `rustls-pki-types` is the typed surface rustls exposes for
# `CertificateDer`, `PrivateKeyDer`, `ServerName`, … The pairing
# transport constructs those values directly so the cert builder
# can hand them to `ServerConfig::with_single_cert` without
# depending on `rustls`'s internals. Already pulled in
# transitively; declaring it directly keeps the surface stable.
rustls-pki-types = { workspace = true, optional = true }
# X.509 + SPKI verifier the mTLS pairing transport uses to decode
# the peer's certificate and verify its self-signature during the
# handshake. Already pulled in transitively by `rustls`; declaring
# it directly keeps the pairing surface stable.
rustls-webpki = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"
serde_json = { workspace = true }
clipvault-core = { path = "../clipvault-core" }
