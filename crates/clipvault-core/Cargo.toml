[package]
name = "clipvault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Business-logic core for ClipVault, free of GUI and Tauri dependencies"

[features]
# Forward the `macos-native` feature to `clipvault-platform/macos-native`
# so the `cfg(feature = "macos-native")` check inside
# `ignored_apps_service::pick_and_add_with_default_picker` actually
# resolves the `MacOsApplicationPicker` symbol from the platform crate.
#
# The core itself never links objc2 directly; it relies on the platform
# crate to surface the adapter when this feature is enabled. Declaring
# the feature here as an empty list (the previous wiring) silently kept
# the cfg false on every build, so `pick_and_add_with_default_picker`
# always fell through to the `IgnoredAppError::BackendUnavailable`
# branch with "macos-native feature not enabled" — the regression the
# picker report surfaced on macOS.
#
# Downstream crates (the Tauri shell) must enable this feature on the
# `clipvault-core` dependency on macOS builds so the forwarding actually
# fires. The forwarding also keeps `cargo build -p clipvault-core
# --features macos-native` compilable on macOS, which is the build
# the regression test in `ignored_apps_service.rs` exercises.
macos-native = ["clipvault-platform/macos-native"]
# Forward the `local-peer-discovery-mdns` feature to
# `clipvault-platform/local-peer-discovery-mdns` so the
# `cfg(feature = "local-peer-discovery-mdns")` check inside the
# bootstrap picks the production `MdnsPeerDiscoveryAdapter` over
# the noop stub. Production shells on macOS / Linux enable this
# feature on both `clipvault-core` and `clipvault-platform`; the
# noop fallback stays the safe default for cross-compiles, tests
# and unsupported targets.
local-peer-discovery-mdns = ["clipvault-platform/local-peer-discovery-mdns"]

[dependencies]
clipvault-db = { path = "../clipvault-db" }
clipvault-platform = { path = "../clipvault-platform" }
clipvault-search = { path = "../clipvault-search" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
parking_lot = { workspace = true }
png = { workspace = true }
sha2 = { workspace = true }
tempfile = "3.10"
# `flate2` is the canonical zlib encoder the PNG `iCCP` chunk
# expects. The crate is already in the dependency graph transitively
# (through `png`); surfacing it as a direct dependency lets the
# asset store emit `iCCP`-shaped chunks without re-implementing
# the deflate wire format. The dependency is small, mature and
# kept narrow by enabling only the `zlib` backend.
flate2 = { workspace = true }
# Ed25519 for the `local-peer-identity-foundation` change. Only the
# core uses these crates to derive `peer_id` and `fingerprint` from
# the public key. Private material is produced here and immediately
# handed to a `PeerIdentityStore` implementation; the core never
# persists, logs or re-exports the secret key bytes.
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
