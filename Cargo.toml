[workspace]
resolver = "2"
members = [
    "crates/clipvault-core",
    "crates/clipvault-db",
    "crates/clipvault-platform",
    "crates/clipvault-search",
    "app/tauri/src-tauri",
]

[workspace.package]
version = "0.0.15"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
time = { version = "0.3", features = ["macros", "formatting", "serde", "serde-well-known"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
parking_lot = "0.12"
arboard = "3"
# Canonical PNG encode/decode for the `clipboard-rich-content` asset
# store. `png` is the same small, mature, pure-Rust codec that already
# ships in the dependency graph transitively (through `image`, which
# `arboard`'s image-data feature pulls in, and through `tauri`'s icon
# handling), so surfacing it as a direct dependency of the core adds no
# new third-party code to the build. See `design.md` §10.
png = "0.17"
# SHA-256 for the deterministic asset name / dedupe key. Already
# present in the graph via `tauri`; RustCrypto's `sha2` is the
# reference implementation and has no transitive surface beyond
# `digest`.
sha2 = "0.10"
flate2 = "1"
global-hotkey = "0.6"
x11rb = "0.13"
# Direct dependency on the dynamic Xlib loader used by the
# `linux-x11-quick-paste-thread-safety` change to call `XInitThreads`
# before any other component opens Xlib. The same crate is already
# pulled in transitively by `global-hotkey` on Linux, so promoting it
# to a direct dependency does not add new third-party code: it only
# gives the platform crate a stable surface to load `XInitThreads`
# without depending on a transitive import that could disappear with
# an upstream refactor.
x11-dl = "2.21"
# Pure-Rust SVG → PNG rasterizer used by the Linux application
# metadata provider to honour `.desktop` entries whose `Icon=` value
# ships as SVG instead of PNG. With `default-features = false` we
# skip text rendering, font database access and raster image
# decoding so the parser can never load arbitrary host files or
# reach the network during a metadata lookup. The provider already
# caps the output dimensions and rejects over-sized payloads.
resvg = { version = "0.45", default-features = false }
objc2 = "0.6"
# `NSBitmapImageRep`, `NSImage` and `NSGraphicsContext` are required by
# the macOS application picker to downscale the bundle icon to
# `<= MAX_ICON_DIM` (256) before writing it as PNG. `NSGraphics` and
# `NSImageRep` are pulled in transitively to expose `NSSize`,
# `NSCompositingOperation` and the colour-space name constants the
# bitmap allocator requires. `objc2-core-graphics` features cover the
# `CGContext`/`CGImage` calls used to redraw the scaled bitmap.
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSApplication", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSGraphicsContext", "NSGraphics", "NSScreen"] }
objc2-core-graphics = { version = "0.3", features = ["CGContext", "CGImage"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
dispatch2 = "0.3"
# Ed25519 key generation, signing and verification for the
# `local-peer-identity-foundation` change. The dependency is
# approved by OpenSpec: the proposal mandates Ed25519 as the
# peer identity primitive and the change ships only the metadata
# surface (peer_id, fingerprint) over the secure store. The crate
# is small, mature and the canonical Rust implementation of RFC
# 8032. See `openspec/changes/local-peer-identity-foundation/design.md`
# §"Dependencias aprobadas".
ed25519-dalek = { version = "2.1", features = ["pkcs8", "rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
# Cross-platform credential storage (macOS Keychain, Linux Secret
# Service over D-Bus, …). Only enabled when the
# `local-peer-identity-keychain` feature is active on the platform
# crate; the core never links the native backend. Approved by
# OpenSpec; see the same `design.md` §"Dependencias aprobadas" for
# the alternatives that were discarded.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "sync-secret-service"] }
# Cross-platform DNS-SD/mDNS daemon the `local-peer-discovery`
# change wraps behind `local-peer-discovery-mdns`. Approved by
# OpenSpec (`local-peer-discovery/design.md` §"Dependencias
# aprobadas"): the crate is small, mature, owned by a single
# maintainer, and offers the multicast + browse + register surface
# RFC 6762/6763 require. The alternative — Bonjour/Avahi FFI —
# duplicates platform work and rejects the metadata-only
# constraint; broadcast/IP-manual scanning is explicitly out of
# scope. Default features are disabled so the bundle links only the
# `mio`/`socket2` runtime; the platform crate pulls `tracing` from
# the workspace for the metadata-only log surface.
mdns-sd = { version = "0.11", default-features = false }
# Asynchronous runtime the `local-peer-mutual-pairing` change uses
# to drive the TLS listener + mTLS handshake + pairing session
# state machine. Approved by OpenSpec: tokio is the canonical Rust
# async runtime, small enough to keep the build hermetic
# (`rt-multi-thread` + `net` + `io` + `time` features only, no
# signal/fs surface), and required by `tokio-rustls`. The runtime
# is encapsulated inside the platform crate so the rest of the
# code stays synchronous and never has to introduce a Tokio
# executor of its own.
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# `rustls-pki-types` is already pulled in transitively by
# `rustls` and `rustls-webpki`, but the pairing transport needs
# the typed wrappers (`CertificateDer`, `PrivateKeyDer`,
# `PrivatePkcs8KeyDer`, `ServerName`) directly so the
# `local-peer-pairing-tls` module can mint certs + keys without
# depending on the `rustls` internals. Same crate, same version
# range; the direct dependency is purely a stable surface.
rustls-pki-types = { version = "1.12", default-features = false, features = ["std"] }
# Pure-Rust TLS stack the pairing change uses for mTLS pinning.
# `ring` (the default crypto provider) keeps the bundle free of
# OpenSSL; `logging` and `tls12` are intentionally disabled because
# the pairing surface only requires TLS 1.3. Approved by OpenSpec
# (`local-peer-mutual-pairing/design.md` §"Dependencias aprobadas"):
# rustls is the canonical pure-Rust TLS implementation, and the
# alternative — `native-tls` / OpenSSL FFI — would force the bundle
# to ship OpenSSL on macOS/Linux and contradicts the local-first,
# offline-first posture the project pins.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Tokio integration for `rustls`. Approved together with `rustls`
# (same design note): the pairing runtime uses the typed tokio
# `TlsAcceptor` / `TlsConnector` API instead of building a custom
# state machine on top of `rustls` directly.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# X.509 certificate generator the pairing runtime uses to mint a
# self-signed cert per local identity. Approved by OpenSpec: `rcgen`
# is small, mature, and the canonical pure-Rust certificate
# generator; the alternative — `x509-parser` or platform `openssl`
# shelling — duplicates work and pulls OpenSSL into the bundle.
# Default features are disabled so the build links only the
# `ring`-backed crypto provider already approved for `rustls`.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
# X.509 + SPKI verifier the mTLS pairing transport uses to decode
# the peer's certificate and verify its self-signature during the
# handshake. The `EndEntityCert::verify_signature` call proves the
# peer holds the private key behind the cert's SPKI without pulling
# in a full X.509 parser. Already pulled in transitively by
# `rustls`; declaring it directly keeps the pairing surface
# stable without depending on a transitive version bump.
rustls-webpki = { version = "0.103", default-features = false, features = ["ring"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
