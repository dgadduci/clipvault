[workspace]
resolver = "2"
members = [
    "crates/clipvault-core",
    "crates/clipvault-db",
    "crates/clipvault-platform",
    "crates/clipvault-search",
    "app/tauri/src-tauri",
]

[workspace.package]
version = "0.0.15"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
time = { version = "0.3", features = ["macros", "formatting", "serde", "serde-well-known"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
parking_lot = "0.12"
arboard = "3"
# Canonical PNG encode/decode for the `clipboard-rich-content` asset
# store. `png` is the same small, mature, pure-Rust codec that already
# ships in the dependency graph transitively (through `image`, which
# `arboard`'s image-data feature pulls in, and through `tauri`'s icon
# handling), so surfacing it as a direct dependency of the core adds no
# new third-party code to the build. See `design.md` §10.
png = "0.17"
# SHA-256 for the deterministic asset name / dedupe key. Already
# present in the graph via `tauri`; RustCrypto's `sha2` is the
# reference implementation and has no transitive surface beyond
# `digest`.
sha2 = "0.10"
flate2 = "1"
global-hotkey = "0.6"
x11rb = "0.13"
# Direct dependency on the dynamic Xlib loader used by the
# `linux-x11-quick-paste-thread-safety` change to call `XInitThreads`
# before any other component opens Xlib. The same crate is already
# pulled in transitively by `global-hotkey` on Linux, so promoting it
# to a direct dependency does not add new third-party code: it only
# gives the platform crate a stable surface to load `XInitThreads`
# without depending on a transitive import that could disappear with
# an upstream refactor.
x11-dl = "2.21"
# Pure-Rust SVG → PNG rasterizer used by the Linux application
# metadata provider to honour `.desktop` entries whose `Icon=` value
# ships as SVG instead of PNG. With `default-features = false` we
# skip text rendering, font database access and raster image
# decoding so the parser can never load arbitrary host files or
# reach the network during a metadata lookup. The provider already
# caps the output dimensions and rejects over-sized payloads.
resvg = { version = "0.45", default-features = false }
objc2 = "0.6"
# `NSBitmapImageRep`, `NSImage` and `NSGraphicsContext` are required by
# the macOS application picker to downscale the bundle icon to
# `<= MAX_ICON_DIM` (256) before writing it as PNG. `NSGraphics` and
# `NSImageRep` are pulled in transitively to expose `NSSize`,
# `NSCompositingOperation` and the colour-space name constants the
# bitmap allocator requires. `objc2-core-graphics` features cover the
# `CGContext`/`CGImage` calls used to redraw the scaled bitmap.
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSApplication", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSGraphicsContext", "NSGraphics", "NSScreen"] }
objc2-core-graphics = { version = "0.3", features = ["CGContext", "CGImage"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
dispatch2 = "0.3"
# Ed25519 key generation, signing and verification for the
# `local-peer-identity-foundation` change. The dependency is
# approved by OpenSpec: the proposal mandates Ed25519 as the
# peer identity primitive and the change ships only the metadata
# surface (peer_id, fingerprint) over the secure store. The crate
# is small, mature and the canonical Rust implementation of RFC
# 8032. See `openspec/changes/local-peer-identity-foundation/design.md`
# §"Dependencias aprobadas".
ed25519-dalek = { version = "2.1", features = ["pkcs8", "rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
# Cross-platform credential storage (macOS Keychain, Linux Secret
# Service over D-Bus, …). Only enabled when the
# `local-peer-identity-keychain` feature is active on the platform
# crate; the core never links the native backend. Approved by
# OpenSpec; see the same `design.md` §"Dependencias aprobadas" for
# the alternatives that were discarded.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "sync-secret-service"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
