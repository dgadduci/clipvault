[package]
name = "clipvault-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri 2 desktop shell for ClipVault (thin adapter over clipvault-core)"

[[bin]]
name = "clipvault-app"
path = "src/main.rs"

[lib]
name = "clipvault_app"
path = "src/lib.rs"

[features]
default = [
    "custom-protocol",
    "clipboard-arboard",
    "hotkey-global",
    "linux-gnome-shell-integration",
    "linux-xlib-init",
    "local-peer-identity-keychain",
    "local-peer-discovery-mdns",
    "local-peer-pairing-tls",
]
custom-protocol = ["tauri/custom-protocol"]
clipboard-arboard = []
hotkey-global = []
linux-x11 = []
# Pull in the concrete `KeychainPeerIdentityStore` on macOS / Linux
# so the bootstrap wires the real secure credential store. Other
# targets (Windows builds for CI, custom cross-compiles) get the
# in-memory fake from `clipvault-core`, which is exactly what the
# `local-peer-identity-foundation` change promises — the secure
# store is opt-in by platform capability.
local-peer-identity-keychain = ["clipvault-platform/local-peer-identity-keychain"]
# Production mTLS pairing transport for the
# `local-peer-mutual-pairing` change. Enabled by default so the
# bootstrap wires the productive TLS-backed transport on macOS /
# Linux instead of the noop stub the platform crate falls back to.
# Windows builds and cross-compiles opt out so the platform crate
# still compiles without linking `rustls` / `tokio-rustls` / `rcgen`.
#
# The feature MUST be propagated to BOTH `clipvault-core` and
# `clipvault-platform` from this central declaration so the
# `install_default_pairing_material_loader` entry point and the
# `start_with_material` install path compile into the production
# binary. Enabling the feature on `clipvault-platform` alone
# leaves the core's `cfg(feature = "local-peer-pairing-tls")`
# check false and the runtime still resolves the noop transport,
# which is the regression the manual Wayland test surfaced as
# `Sin TLS local`. Forwarding through `clipvault-core` (which
# itself forwards to `clipvault-platform`) keeps the wiring in a
# single place so the macOS / Linux target-specific dependency
# blocks do not have to repeat it.
local-peer-pairing-tls = [
    "clipvault-core/local-peer-pairing-tls",
    "clipvault-platform/local-peer-pairing-tls",
]
# Production mDNS adapter for the `local-peer-discovery` change.
# Enabled by default so the bootstrap installs the
# `MdnsPeerDiscoveryAdapter` on macOS / Linux instead of the
# `NoopPeerDiscoveryAdapter` the platform crate falls back to.
# Windows builds and cross-compiles opt out so the platform crate
# still compiles without linking `mdns-sd`.
#
# The feature MUST be propagated to BOTH `clipvault-core` and
# `clipvault-platform` from this central declaration. The bootstrap
# in `clipvault-core` selects between `MdnsPeerDiscoveryAdapter` and
# `NoopPeerDiscoveryAdapter` via its OWN `cfg(feature =
# "local-peer-discovery-mdns")` check — enabling the feature on
# `clipvault-platform` alone leaves the core's cfg false and the
# runtime still resolves `NoopPeerDiscoveryAdapter` on Linux, which
# is the regression that surfaced as `Sin red local` in the manual
# Wayland test. Forwarding through `clipvault-core` (which itself
# forwards to `clipvault-platform`) keeps the wiring in a single
# place so the macOS / Linux target-specific dependency blocks do
# not have to repeat it.
local-peer-discovery-mdns = [
    "clipvault-core/local-peer-discovery-mdns",
    "clipvault-platform/local-peer-discovery-mdns",
]
# Linux native Wayland active-app detection (`ext-foreign-toplevel-list-v1`
# with `zwlr_foreign_toplevel_management_unstable_v1` fallback). The
# feature is opt-in so macOS / non-Linux builds never link the Wayland
# code path. The shell enables it from the target-specific dependency
# block below.
linux-wayland-active-app = []
# Process-wide Xlib thread-safety preflight (`XInitThreads`). The
# shell enables this feature in the default list so a normal Linux
# build of `clipvault-app` compiles the `xlib_init_once()` call site
# in `main.rs`. Cargo does NOT propagate a feature enabled on a
# dependency (even via a `[target.'cfg(...)'.dependencies]`
# re-declaration) back into the consumer's own `[features]` table,
# so the feature MUST be enabled in the consumer's `default = [...]`
# list for the `#[cfg(feature = "linux-xlib-init")]` block to compile.
# The runtime call itself is gated by `#[cfg(target_os = "linux")]`
# so macOS / Windows builds never invoke Xlib even though the
# feature is enabled.
linux-xlib-init = ["clipvault-platform/linux-xlib-init"]
# GNOME Shell integration is enabled in normal product builds so Tauri
# compiles the shell commands that surface consent and installation. The
# consuming code remains cfg(target_os = "linux"), so other targets do not
# compile or expose the integration.
linux-gnome-shell-integration = ["clipvault-platform/linux-gnome-shell-integration"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipvault-core = { path = "../../../crates/clipvault-core" }
clipvault-db = { path = "../../../crates/clipvault-db" }
clipvault-platform = { path = "../../../crates/clipvault-platform", features = [
    "clipboard-arboard",
    "hotkey-global",
] }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
time = { workspace = true }
arboard = { workspace = true }
global-hotkey = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
clipvault-core = { path = "../../../crates/clipvault-core", features = [
    "macos-native",
    "local-peer-discovery-mdns",
    "local-peer-pairing-tls",
] }
clipvault-platform = { path = "../../../crates/clipvault-platform", features = [
    "clipboard-arboard",
    "hotkey-global",
    "macos-native",
    "local-peer-identity-keychain",
    "local-peer-discovery-mdns",
    "local-peer-pairing-tls",
] }
objc2-foundation = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_os = "macos")))'.dependencies]
clipvault-platform = { path = "../../../crates/clipvault-platform", features = [
    "clipboard-arboard",
    "hotkey-global",
    "linux-x11",
    "linux-svg-raster",
    "linux-wayland-active-app",
    "linux-xlib-init",
    "linux-gnome-shell-integration",
    "local-peer-identity-keychain",
    "local-peer-discovery-mdns",
    "local-peer-pairing-tls",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
