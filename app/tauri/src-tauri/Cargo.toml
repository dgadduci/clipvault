[package]
name = "clipvault-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri 2 desktop shell for ClipVault (thin adapter over clipvault-core)"

[[bin]]
name = "clipvault-app"
path = "src/main.rs"

[lib]
name = "clipvault_app"
path = "src/lib.rs"

[features]
default = [
    "custom-protocol",
    "clipboard-arboard",
    "hotkey-global",
    "linux-gnome-shell-integration",
]
custom-protocol = ["tauri/custom-protocol"]
clipboard-arboard = []
hotkey-global = []
linux-x11 = []
# Linux native Wayland active-app detection (`ext-foreign-toplevel-list-v1`
# with `zwlr_foreign_toplevel_management_unstable_v1` fallback). The
# feature is opt-in so macOS / non-Linux builds never link the Wayland
# code path. The shell enables it from the target-specific dependency
# block below.
linux-wayland-active-app = []
# GNOME Shell integration is enabled in normal product builds so Tauri
# compiles the shell commands that surface consent and installation. The
# consuming code remains cfg(target_os = "linux"), so other targets do not
# compile or expose the integration.
linux-gnome-shell-integration = ["clipvault-platform/linux-gnome-shell-integration"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipvault-core = { path = "../../../crates/clipvault-core" }
clipvault-db = { path = "../../../crates/clipvault-db" }
clipvault-platform = { path = "../../../crates/clipvault-platform", features = [
    "clipboard-arboard",
    "hotkey-global",
] }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
time = { workspace = true }
arboard = { workspace = true }
global-hotkey = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
clipvault-core = { path = "../../../crates/clipvault-core", features = [
    "macos-native",
] }
clipvault-platform = { path = "../../../crates/clipvault-platform", features = [
    "clipboard-arboard",
    "hotkey-global",
    "macos-native",
] }
objc2-foundation = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_os = "macos")))'.dependencies]
clipvault-platform = { path = "../../../crates/clipvault-platform", features = [
    "clipboard-arboard",
    "hotkey-global",
    "linux-x11",
    "linux-svg-raster",
    "linux-wayland-active-app",
    "linux-gnome-shell-integration",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
